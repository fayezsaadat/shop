<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Shopping Cart — VOLT ATHLETICS</title>
<meta name="description" content="Review your VOLT ATHLETICS cart, update quantities, apply a promo code and check out securely.">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="cart">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="container">
    <div class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span aria-hidden="true">/</span><span>Cart</span>
      </nav>
      <h1 class="h1" style="margin-top:14px">Your cart</h1>
    </div>

    <div class="cart-layout" id="cartMain">
      <div>
        <div class="cart-table__head" id="cartHead">
          <span>Product</span><span>Quantity</span><span style="text-align:right">Total</span><span></span>
        </div>
        <div id="cartRows"></div>
        <div id="cartEmpty" hidden></div>

        <div class="flex between items-center wrap gap-12" style="margin-top:26px">
          <a class="link-underline" href="new-arrivals.html">Continue shopping</a>
          <p class="small muted">Prices include VAT where applicable.</p>
        </div>
      </div>

      <aside class="cart-summary-wrap">
        <div class="panel panel--gray panel--sticky" id="cartSummary"></div>
      </aside>
    </div>

    <section class="section section--tight">
      <div class="section-head">
        <div><p class="eyebrow">Frequently bought together</p><h2 class="h2">Add to your order</h2></div>
        <a class="link-underline" href="best-sellers.html">View all</a>
      </div>
      <div class="product-grid product-grid--4" id="cartCrossSell"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
